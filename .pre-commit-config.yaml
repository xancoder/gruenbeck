repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # keep in sync with the ruff version in uv.lock
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # assets/ holds the unchanged documentation of the manufacturer; in the .tsv file,
      # rows made of tabs are empty fields, not trailing whitespace
      - id: trailing-whitespace
        exclude: ^assets/
      - id: end-of-file-fixer
        exclude: ^assets/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

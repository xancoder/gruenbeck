repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # keep in sync with the ruff version in uv.lock
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # assets/ holds the documentation of the manufacturer and its manual conversion
      # into the parameter file: the hooks must not change them
      - id: trailing-whitespace
        exclude: ^assets/
      - id: end-of-file-fixer
        exclude: ^assets/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # checks the staged changes of a commit
      - id: gitleaks
      # scans the whole git history; the hook above sees nothing in CI, where no change is
      # staged: uv run pre-commit run --hook-stage manual gitleaks-history
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (git history)
        entry: gitleaks git --redact --no-banner --verbose
        stages: [manual]
        always_run: true

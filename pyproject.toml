[project]
name = "gruenbeck"
version = "0.1.0"
description = "Collects water consumption data from a Grünbeck soft water system and stores it as CSV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.scripts]
gruenbeck-collect = "gruenbeck.cli:collect"
gruenbeck-analyse = "gruenbeck.cli:analyse"

[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9",
    "pytest-cov>=6",
    "responses>=0.26.3",
    "ruff>=0.17.6",
    "types-requests>=2.33.0.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# G (flake8-logging-format): %-style arguments instead of f-strings in logging calls
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "G"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
check_untyped_defs = true

# pandas and matplotlib only belong to the optional "analysis" extra, which is not part of
# the dev environment, and pandas ships no type information
[[tool.mypy.overrides]]
module = ["matplotlib.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
strict = true
